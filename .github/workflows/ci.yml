name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        default: ubuntu
        options:
          - ubuntu
          - appimage
          - flatpak
          - linux-packages
          - linux
          - macos
          - windows
          - windows-arm64
          - all

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: RelWithDebInfo
  BUILD_NUMBER: ${{ github.run_number }}
  QT_VERSION: 6.10.3
  AQT_MODULES: qtshadertools

jobs:
  linux-ubuntu:
    name: Linux / Ubuntu 24.04
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'ubuntu' || inputs.target == 'appimage' || inputs.target == 'flatpak' || inputs.target == 'linux-packages' || inputs.target == 'linux' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo bash ci/install-linux-deps.sh ubuntu

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            .qt
            ~/.cache/pip
            ~/.conan2/p
          key: ci-linux-ubuntu-24.04-qt-${{ env.QT_VERSION }}-${{ hashFiles('conanfile.py', '.github/workflows/ci.yml') }}
          restore-keys: |
            ci-linux-ubuntu-24.04-qt-${{ env.QT_VERSION }}-
            ci-linux-ubuntu-24.04-

      - name: Install Python build tools
        run: |
          python3 -m pip install --user --break-system-packages conan aqtinstall cmake ninja
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install Qt
        run: |
          qt_root="${GITHUB_WORKSPACE}/.qt/${QT_VERSION}/gcc_64"
          if [ ! -d "${qt_root}" ]; then
            python3 -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
              --modules ${AQT_MODULES} \
              --outputdir "${GITHUB_WORKSPACE}/.qt"
          fi
          echo "QT_ROOT=${qt_root}" >> "${GITHUB_ENV}"

      - name: Install Conan dependencies
        run: |
          conan profile detect --force
          conan install . --build=missing \
            -s build_type="${BUILD_TYPE}" \
            -s compiler.cppstd=20 \
            -o '&:with_qt=False' \
            -c tools.files.download:retry=5 \
            -c tools.files.download:retry_wait=10 \
            --output-folder=build

      - name: Build QWindowKit
        run: bash ci/build-qwindowkit.sh "${QT_ROOT}" "${BUILD_TYPE}"

      - name: Configure ZoinGallery
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/build/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DZOIN_BUILD_NUMBER="${BUILD_NUMBER}" \
            -DUSE_QWK=ON \
            -DCMAKE_PREFIX_PATH="${QT_ROOT};${GITHUB_WORKSPACE}/build;${GITHUB_WORKSPACE}/build/qwindowkit-install"

      - name: Build ZoinGallery
        run: cmake --build build --parallel

      - name: Smoke test
        run: bash ci/smoke-test.sh "${QT_ROOT}"

      - name: Prepare app artifact
        run: bash ci/deploy-linux.sh "${QT_ROOT}" "ZoinGallery-linux-ubuntu-24.04-b${BUILD_NUMBER}"

      - name: Smoke test app artifact
        run: bash ci/smoke-test-linux-package.sh "build/artifacts/ZoinGallery-linux-ubuntu-24.04-b${BUILD_NUMBER}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoinGallery-linux-ubuntu-24.04-b${{ github.run_number }}
          path: build/artifacts/ZoinGallery-linux-ubuntu-24.04-b${{ github.run_number }}.tar.zst
          if-no-files-found: error

      - name: Prepare AppImage
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'appimage' || inputs.target == 'linux-packages' || inputs.target == 'all') }}
        run: bash ci/create-appimage.sh "build/artifacts/ZoinGallery-linux-ubuntu-24.04-b${BUILD_NUMBER}" "ZoinGallery-x86_64-b${BUILD_NUMBER}"

      - name: Smoke test AppImage
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'appimage' || inputs.target == 'linux-packages' || inputs.target == 'all') }}
        run: bash ci/smoke-test-appimage.sh "build/artifacts/ZoinGallery-x86_64-b${BUILD_NUMBER}.AppImage"

      - name: Upload AppImage
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'appimage' || inputs.target == 'linux-packages' || inputs.target == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: ZoinGallery-appimage-x86_64-b${{ github.run_number }}
          path: build/artifacts/ZoinGallery-x86_64-b${{ github.run_number }}.AppImage
          if-no-files-found: error

      - name: Install Flatpak tools
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'flatpak' || inputs.target == 'linux-packages' || inputs.target == 'all') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-x11 elfutils flatpak flatpak-builder librsvg2-bin

      - name: Prepare Flatpak
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'flatpak' || inputs.target == 'linux-packages' || inputs.target == 'all') }}
        run: bash ci/create-flatpak.sh "build/artifacts/ZoinGallery-linux-ubuntu-24.04-b${BUILD_NUMBER}" "ZoinGallery-flatpak-x86_64-b${BUILD_NUMBER}"

      - name: Smoke test Flatpak
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'flatpak' || inputs.target == 'linux-packages' || inputs.target == 'all') }}
        run: bash ci/smoke-test-flatpak.sh "build/artifacts/ZoinGallery-flatpak-x86_64-b${BUILD_NUMBER}.flatpak"

      - name: Upload Flatpak
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'flatpak' || inputs.target == 'linux-packages' || inputs.target == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: ZoinGallery-flatpak-x86_64-b${{ github.run_number }}
          path: build/artifacts/ZoinGallery-flatpak-x86_64-b${{ github.run_number }}.flatpak
          if-no-files-found: error

  linux-containers:
    name: Linux / ${{ matrix.name }}
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'linux' || inputs.target == 'all') }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
      options: --user root
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            distro: debian
            image: debian:12
            cache_key: debian-12
          - name: Fedora latest
            distro: fedora
            image: fedora:latest
            cache_key: fedora-latest
          - name: Arch latest
            distro: arch
            image: archlinux:latest
            cache_key: arch-latest

    steps:
      - name: Install base tools for checkout
        run: |
          case "${{ matrix.distro }}" in
            debian)
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates git gzip tar zstd
              ;;
            fedora)
              dnf install -y ca-certificates git gzip tar zstd
              ;;
            arch)
              pacman -Syu --noconfirm --needed ca-certificates git gzip tar zstd
              ;;
          esac

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: bash ci/install-linux-deps.sh "${{ matrix.distro }}"

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            .qt
            ~/.cache/pip
            ~/.conan2/p
          key: ci-linux-${{ matrix.cache_key }}-qt-${{ env.QT_VERSION }}-${{ hashFiles('conanfile.py', '.github/workflows/ci.yml') }}
          restore-keys: |
            ci-linux-${{ matrix.cache_key }}-qt-${{ env.QT_VERSION }}-
            ci-linux-${{ matrix.cache_key }}-

      - name: Install Python build tools
        run: |
          python3 -m pip install --user --break-system-packages conan aqtinstall cmake ninja || \
            python3 -m pip install --user conan aqtinstall cmake ninja
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install Qt
        run: |
          qt_root="${GITHUB_WORKSPACE}/.qt/${QT_VERSION}/gcc_64"
          if [ ! -d "${qt_root}" ]; then
            python3 -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
              --modules ${AQT_MODULES} \
              --outputdir "${GITHUB_WORKSPACE}/.qt"
          fi
          echo "QT_ROOT=${qt_root}" >> "${GITHUB_ENV}"

      - name: Install Conan dependencies
        run: |
          conan profile detect --force
          conan install . --build=missing \
            -s build_type="${BUILD_TYPE}" \
            -s compiler.cppstd=20 \
            -o '&:with_qt=False' \
            -c tools.files.download:retry=5 \
            -c tools.files.download:retry_wait=10 \
            --output-folder=build

      - name: Build QWindowKit
        run: bash ci/build-qwindowkit.sh "${QT_ROOT}" "${BUILD_TYPE}"

      - name: Configure ZoinGallery
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/build/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DZOIN_BUILD_NUMBER="${BUILD_NUMBER}" \
            -DUSE_QWK=ON \
            -DCMAKE_PREFIX_PATH="${QT_ROOT};${GITHUB_WORKSPACE}/build;${GITHUB_WORKSPACE}/build/qwindowkit-install"

      - name: Build ZoinGallery
        run: cmake --build build --parallel

      - name: Smoke test
        run: bash ci/smoke-test.sh "${QT_ROOT}"

      - name: Prepare app artifact
        run: bash ci/deploy-linux.sh "${QT_ROOT}" "ZoinGallery-linux-${{ matrix.cache_key }}-b${BUILD_NUMBER}"

      - name: Smoke test app artifact
        run: bash ci/smoke-test-linux-package.sh "build/artifacts/ZoinGallery-linux-${{ matrix.cache_key }}-b${BUILD_NUMBER}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoinGallery-linux-${{ matrix.cache_key }}-b${{ github.run_number }}
          path: build/artifacts/ZoinGallery-linux-${{ matrix.cache_key }}-b${{ github.run_number }}.tar.zst
          if-no-files-found: error

  macos:
    name: macOS 15
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'macos' || inputs.target == 'all') }}
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            .qt
            ~/Library/Caches/pip
            ~/.conan2/p
          key: ci-macos-15-qt-${{ env.QT_VERSION }}-${{ hashFiles('conanfile.py', '.github/workflows/ci.yml') }}
          restore-keys: |
            ci-macos-15-qt-${{ env.QT_VERSION }}-
            ci-macos-15-

      - name: Install Python build tools
        run: |
          python3 -m pip install --user --break-system-packages conan aqtinstall cmake ninja
          echo "$(python3 -m site --user-base)/bin" >> "${GITHUB_PATH}"

      - name: Install Qt
        run: |
          qt_root="${GITHUB_WORKSPACE}/.qt/${QT_VERSION}/macos"
          if [ ! -d "${qt_root}" ]; then
            python3 -m aqt install-qt mac desktop "${QT_VERSION}" clang_64 \
              --modules ${AQT_MODULES} \
              --outputdir "${GITHUB_WORKSPACE}/.qt"
          fi
          echo "QT_ROOT=${qt_root}" >> "${GITHUB_ENV}"

      - name: Install Conan dependencies
        run: |
          conan profile detect --force
          conan install . --build=missing \
            -s build_type="${BUILD_TYPE}" \
            -s compiler.cppstd=20 \
            -o '&:with_qt=False' \
            -c tools.files.download:retry=5 \
            -c tools.files.download:retry_wait=10 \
            --output-folder=build

      - name: Build QWindowKit
        run: bash ci/build-qwindowkit.sh "${QT_ROOT}" "${BUILD_TYPE}"

      - name: Configure ZoinGallery
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/build/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DZOIN_BUILD_NUMBER="${BUILD_NUMBER}" \
            -DUSE_QWK=ON \
            -DZOIN_MACOS_CODE_SIGN=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DCMAKE_PREFIX_PATH="${QT_ROOT};${GITHUB_WORKSPACE}/build;${GITHUB_WORKSPACE}/build/qwindowkit-install"

      - name: Build ZoinGallery
        run: cmake --build build --parallel

      - name: Smoke test
        run: bash ci/smoke-test.sh "${QT_ROOT}"

      - name: Prepare app artifact
        run: |
          app="build/bin/RelWithDebInfo/ZoinGallery.app"
          bash ci/deploy-macos.sh "${QT_ROOT}" "${app}"
          codesign --force --deep --timestamp=none --sign - "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"
          rm -rf build/dmg-root
          mkdir -p build/artifacts build/dmg-root
          ditto "${app}" "build/dmg-root/ZoinGallery.app"
          codesign --verify --deep --strict --verbose=2 "build/dmg-root/ZoinGallery.app"
          hdiutil create \
            -volname "ZoinGallery b${BUILD_NUMBER}" \
            -srcfolder "build/dmg-root" \
            -ov \
            -format UDZO \
            "build/artifacts/ZoinGallery-macos-15-b${BUILD_NUMBER}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoinGallery-macos-15-b${{ github.run_number }}
          path: build/artifacts/ZoinGallery-macos-15-b${{ github.run_number }}.dmg
          if-no-files-found: error

  windows:
    name: Windows Server 2022
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'windows' || inputs.target == 'all') }}
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            .qt
            ~\AppData\Local\pip\Cache
            ~\.conan2\p
          key: ci-windows-2022-qt-${{ env.QT_VERSION }}-${{ hashFiles('conanfile.py', '.github/workflows/ci.yml') }}
          restore-keys: |
            ci-windows-2022-qt-${{ env.QT_VERSION }}-
            ci-windows-2022-

      - name: Install Python build tools
        shell: pwsh
        run: |
          python -m pip install --user conan aqtinstall cmake ninja
          $userBase = python -c "import site; print(site.USER_BASE)"
          $userScripts = Join-Path $userBase "Scripts"
          $env:PATH = "$userScripts;$env:PATH"
          $userScripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt
        shell: pwsh
        run: |
          $qtRoot = Join-Path $env:GITHUB_WORKSPACE ".qt\${env:QT_VERSION}\msvc2022_64"
          if (!(Test-Path $qtRoot)) {
            $modules = $env:AQT_MODULES -split ' '
            python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 `
              --modules $modules `
              --outputdir (Join-Path $env:GITHUB_WORKSPACE ".qt")
          }
          "QT_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Conan dependencies
        shell: pwsh
        run: |
          python -c "import sys; from conan.cli.cli import main; main(sys.argv[1:])" profile detect --force
          python -c "import sys; from conan.cli.cli import main; main(sys.argv[1:])" install . --build=missing `
            -s build_type="$env:BUILD_TYPE" `
            -s compiler.cppstd=20 `
            -o "&:with_qt=False" `
            -o "libtiff/*:lzma=False" `
            -c tools.files.download:retry=5 `
            -c tools.files.download:retry_wait=10 `
            -c tools.cmake.cmaketoolchain:generator=Ninja `
            --output-folder=build

      - name: Build QWindowKit
        shell: pwsh
        run: .\ci\build-qwindowkit.ps1 -QtRoot "$env:QT_ROOT" -BuildType "$env:BUILD_TYPE"

      - name: Configure ZoinGallery
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\build\conan_toolchain.cmake" `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DZOIN_BUILD_NUMBER="$env:BUILD_NUMBER" `
            -DUSE_QWK=ON `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT;$env:GITHUB_WORKSPACE\build;$env:GITHUB_WORKSPACE\build\qwindowkit-install"

      - name: Build ZoinGallery
        shell: pwsh
        run: cmake --build build --parallel

      - name: Prepare app artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build\bin -Recurse -Filter ZoinGallery.exe | Select-Object -First 1
          if (!$exe) { throw "Could not find ZoinGallery.exe" }
          & "$env:QT_ROOT\bin\windeployqt.exe" --no-translations --no-compiler-runtime $exe.FullName
          $qwkBin = Join-Path $env:GITHUB_WORKSPACE "build\qwindowkit-install\bin"
          if (Test-Path $qwkBin) {
            Copy-Item "$qwkBin\*.dll" -Destination (Split-Path $exe.FullName -Parent) -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test
        shell: pwsh
        run: .\ci\smoke-test.ps1 -QtRoot "$env:QT_ROOT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoinGallery-windows-2022-b${{ github.run_number }}
          path: build/bin
          if-no-files-found: error

  windows-arm64:
    name: Windows / ARM64
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'windows-arm64' || inputs.target == 'windows' || inputs.target == 'all') }}
    runs-on: windows-11-arm
    timeout-minutes: 90

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Initialize MSVC for ARM64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            .qt
            ~\AppData\Local\pip\Cache
            ~\.conan2\p
          key: ci-windows-11-arm64-qt-${{ env.QT_VERSION }}-${{ hashFiles('conanfile.py', '.github/workflows/ci.yml') }}
          restore-keys: |
            ci-windows-11-arm64-qt-${{ env.QT_VERSION }}-
            ci-windows-11-arm64-

      - name: Install Python build tools
        shell: pwsh
        run: |
          python -m pip install --user conan aqtinstall cmake ninja
          $userBase = python -c "import site; print(site.USER_BASE)"
          $userScripts = Join-Path $userBase "Scripts"
          $env:PATH = "$userScripts;$env:PATH"
          $userScripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt for Windows on ARM
        shell: pwsh
        run: |
          $qtRoot = Join-Path $env:GITHUB_WORKSPACE ".qt\${env:QT_VERSION}\msvc2022_arm64"
          if (!(Test-Path $qtRoot)) {
            $modules = $env:AQT_MODULES -split ' '
            python -m aqt install-qt windows_arm64 desktop $env:QT_VERSION win64_msvc2022_arm64 `
              --modules $modules `
              --outputdir (Join-Path $env:GITHUB_WORKSPACE ".qt")
          }
          "QT_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Conan dependencies
        shell: pwsh
        run: |
          python -c "import sys; from conan.cli.cli import main; main(sys.argv[1:])" profile detect --force
          python -c "import sys; from conan.cli.cli import main; main(sys.argv[1:])" install . --build=missing `
            -s arch=armv8 `
            -s build_type="$env:BUILD_TYPE" `
            -s compiler.cppstd=20 `
            -o "&:with_qt=False" `
            -o "libtiff/*:lzma=False" `
            -c tools.files.download:retry=5 `
            -c tools.files.download:retry_wait=10 `
            -c tools.cmake.cmaketoolchain:generator=Ninja `
            --output-folder=build

      - name: Build QWindowKit
        shell: pwsh
        run: .\ci\build-qwindowkit.ps1 -QtRoot "$env:QT_ROOT" -BuildType "$env:BUILD_TYPE"

      - name: Configure ZoinGallery
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\build\conan_toolchain.cmake" `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DZOIN_BUILD_NUMBER="$env:BUILD_NUMBER" `
            -DUSE_QWK=ON `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT;$env:GITHUB_WORKSPACE\build;$env:GITHUB_WORKSPACE\build\qwindowkit-install"

      - name: Build ZoinGallery
        shell: pwsh
        run: cmake --build build --parallel

      - name: Prepare app artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build\bin -Recurse -Filter ZoinGallery.exe | Select-Object -First 1
          if (!$exe) { throw "Could not find ZoinGallery.exe" }
          & "$env:QT_ROOT\bin\windeployqt.exe" --no-translations --no-compiler-runtime $exe.FullName
          $qwkBin = Join-Path $env:GITHUB_WORKSPACE "build\qwindowkit-install\bin"
          if (Test-Path $qwkBin) {
            Copy-Item "$qwkBin\*.dll" -Destination (Split-Path $exe.FullName -Parent) -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test
        shell: pwsh
        run: .\ci\smoke-test.ps1 -QtRoot "$env:QT_ROOT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoinGallery-windows-arm64-b${{ github.run_number }}
          path: build/bin
          if-no-files-found: error

  update-readme:
    name: Update README artifact table
    runs-on: ubuntu-24.04
    needs:
      - linux-ubuntu
      - linux-containers
      - macos
      - windows
      - windows-arm64
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'all' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Update README artifact table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/update-readme-artifacts.py

      - name: Commit README update
        run: |
          if git diff --quiet README.md; then
            echo "README artifact table already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update CI artifact table [skip ci]"
          git push
